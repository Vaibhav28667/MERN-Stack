<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<title>Document</title>
<body class="flex justify-center items-center h-screen bg-gray-500">
    <div class=" w-1/5 p-8 rounded-xl shadow-xl bg-white ">
    
        <h3 class="text-center font-bold text-2xl my-5 ">Login</h3>
    
        <form>
    
            <label for="username">Username</label>
            <input type="text" class="w-full border rounded-md px-4 py-2 mb-6">
    
            <label for="email">Email Address</label>
            <input type="email" class="w-full border rounded-md px-4 py-2 mb-6">
    
            <label for="password">Password</label>
            <input type="password" class="w-full border rounded-md px-4 py-2 mb-6">
    
            <label for="confirm-password">Confirm Password</label>
            <input type="password" class="w-full border rounded-md px-4 py-2 mb-6">
    
            <a href="#" class="block text-blue-500 text-sm my-3">Forgot password?</a>
            <button class="bg-blue-500 text-white px-4 py-2 w-full rounded-md">Login</button>
            
    
            <a href="#" class="block text-blue-500 text-sm my-3 text-center font-semibold">Not Registered Yet?Sign-up</a>
    
        </form>
    
    </div>
</body>

</html>
